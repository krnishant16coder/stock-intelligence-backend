server:
  port: ${PORT:8080}

spring:
  application:
    name: stock-intelligence
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockintel}
    username: ${SPRING_DATASOURCE_USERNAME:stockintel}
    password: ${SPRING_DATASOURCE_PASSWORD:stockintel}
    hikari:
      # Neon pooled connections are closed server-side after a few minutes idle.
      # Defaults must stay well below that or you get
      # "Failed to validate connection ... has been closed" warnings.
      # Hikari default max-lifetime is 30 min which is far too long for Neon/PgBouncer.
      max-lifetime: ${HIKARI_MAX_LIFETIME:300000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:60000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:30000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:3000}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://polite-beach-04e8b6f00.1.azurestaticapps.net,http://localhost:5173}
  market-data-provider: ${APP_MARKET_DATA_PROVIDER:alphavantage} # alphavantage | twelvedata
  news-provider: ${APP_NEWS_PROVIDER:newsapi}                     # newsapi | gnews | newsdata
  ai-provider: ${APP_AI_PROVIDER:openai}                          # openai (OpenAI-compatible endpoint)
  http:
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
  alpha-vantage:
    api-key: ${ALPHAVANTAGE_API_KEY:}
    base-url: https://www.alphavantage.co
  twelve-data:
    api-key: ${TWELVEDATA_API_KEY:}
    base-url: https://api.twelvedata.com
  news-api:
    api-key: ${NEWSAPI_API_KEY:}
    base-url: https://newsapi.org
  gnews:
    api-key: ${GNEWS_API_KEY:}
    base-url: https://gnews.io
  newsdata:
    api-key: ${NEWSDATA_API_KEY:}
    base-url: https://newsdata.io
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: 120
    max-news-for-ai: ${AI_MAX_NEWS_FOR_AI:3}
    min-interval-ms: ${AI_MIN_INTERVAL_MS:12000}
    max-tokens: ${AI_MAX_TOKENS:500}
    json-mode: ${AI_JSON_MODE:true}
  analysis:
    daily-move-pct: 5.0
    weekly-decline-pct: 10.0
    monthly-decline-pct: 15.0
    volume-surge-multiple: 3.0
    volume-average-days: 20
    history-days: 90
    news-days: 14
    news-max-articles: 20
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
    report-check-cron: "0 0 * * * *"
    alert-monitor-cron: "0 0 */4 * * *"
    eod-digest-cron: ${EOD_DIGEST_CRON:0 0 16 * * MON-FRI}
  notifications:
    enabled: ${APP_NOTIFICATIONS_ENABLED:true}
    default-recipient: ${NOTIFICATION_EMAIL_TO:}
    from: ${NOTIFICATION_EMAIL_FROM:stock-intelligence@localhost}
    report-severities: HIGH,CRITICAL

management:
  endpoints:
    web:
      exposure:
        include: health,info
